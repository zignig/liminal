[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]

clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
iroh-blobs = { version = "0.105.0", default-features = false, features = [
    "fs-store",
] }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
n0-future = "0.3.2"

tracing-subscriber = "0.3.23"
tracing = "0.1.44"

wash-runtime = { path = "..\\..\\wasmCloud\\crates\\wash-runtime", default-features = false, features = [
    "wasi-keyvalue",
    "wasi-config",
    "wasi-logging",
    "wasi-blobstore",
    "wasm_component_model_implements",
] }

wasmtime = { version = "48.0.8", default-features = false }
wasmtime-wasi = { version = "48.0.8", default-features = false }
wasmtime-wasi-io = { version = "48.0.8", default-features = false }
wasmtime-wasi-http = { version = "48.0.8", default-features = false }
wasmtime-wasi-tls = { version = "48.0.8", default-features = false }

uuid = { version = "1.29.0", features = ["v4", "v7"] }
async-trait = "0.1.92"
hyper = "1.12.0"
bytes = "1.12.1"
wit-component = "0.263.0"
toml = "1.2.1"
semver = "1.0.28"
iroh = "1.5.0"
irpc = "1.0.0"
turso = "0.8.4"
rcan = "0.4.1"
iroh-gossip = "0.103.0"
chrono = "0.4.45"
