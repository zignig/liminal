[package]
name = "admin"
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
askama = "0.16.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path"] }
mime_guess = "2.0.5"
rust-embed = "8.14.0"
serde = { version = "1.0", features = ["derive"] }
wstd = "0.6"
wstd-axum = "0.6"

[package.metadata.cargo-machete]
ignored = ["wstd"]

[profile.release]
lto = true
opt-level = "s"
strip = true
