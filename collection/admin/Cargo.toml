[package]
name = "admin"
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
askama = "0.16.1"
axum = { version = "0.8", default-features = false, features = [
    "json",
    "query",
    "matched-path",
    "form",
] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
mime_guess = "2.0.5"
postcard = { version = "1.1.3", features = ["alloc"] }
rust-embed = { version = "8.14.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tower-cookies = "0.11.0"
wit-bindgen = "0.63.0"
wstd = "0.6"
wstd-axum = "0.6"

[package.metadata.cargo-machete]
ignored = ["wstd"]

[profile.release]
lto = true
opt-level = "s"
strip = true
