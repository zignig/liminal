<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ section }}{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="static/css/oat.min.css" />
    <link rel="stylesheet" type="text/css" href="static/css/app.css" />
    <script src="static/js/oat.min.js" defer></script>
    {% block head %}
    {% endblock %}
</head>

<body data-sidebar-layout="always">
    {% include "topbar.html" %}
    <aside data-sidebar>
        <nav>
            <ul>
                <li><a href="#!/list" aria-current="page">Home</a></li>
                <li><a href="#!/catalogue">Catalogue</a></li>
                <li>
                    <details open>
                        <summary>Settings</summary>
                        <ul>
                            <li><a href="#sidebar">General</a></li>
                            <li><a href="#sidebar">Security</a></li>
                            <li><a href="#sidebar">Billing</a></li>
                        </ul>
                    </details>
                </li>
            </ul>
        </nav>
        <footer>
            <button class="outline small" id="prefill" style="width: 100%;">Prefill</button>
            <button class="outline small" style="width: 100%;">Logout</button>
        </footer>
    </aside>
    <main>
        <div class="container">
            {% block content %}<p>Content Block Placeholder</p>{% endblock %}
        </div>
    </main>
    <script src="static/js/app.js"></script>
    {%block scripts %}{% endblock %}
</body>

</html>
