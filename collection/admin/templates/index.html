{% extends "_base.html" %}

{% block head %}
<script src="static/js/app.js"></script>
{% endblock %}

{% block auth %}
{% if let Some(user)= username %}
<a href="logout" class="button is-small">
    {{ user }}
</a>
{% else %}
<a href="login" class="button is-small">
    Log in
</a>
{% endif %}

{% endblock %}
{% block content %}
<div class="content">
    <h1>Large Heading</h1>
    <div class="card">
        <div class="card-content">
            <div class="content">
                Text talking about stuff and things.
            </div>
        </div>
    </div>
    <div class="status"></div>
</div>
{% endblock %}
