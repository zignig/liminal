{% extends "_base.html" %}

{% block head %}

{% block auth %}
{% if let Some(user)= username %}
<a href="logout" class="button is-small">
    {{ user }}
</a>

{% else %}
<a href="login" class="button is-small">
    Log in
</a>
{% endif %}

{% endblock %}
{% block content %}
<h1>Template index page</h1>
<p class="status"></p>
{% endblock %}
