{% extends "_base.html" %}

{% block head %}
{% endblock %}

{% block auth %}
{% if let Some(user)= username %}
<a href="logout" class="button is-small">
    {{ user }}
</a>
{% else %}
<a href="login" class="button is-small">
    Log in
</a>
{% endif %}

{% endblock %}

{% block content %}
<!-- this is the controlled div -->
<div id="interface"></div>
{% endblock %}

{% block scripts %}
<script src="static/js/mithril.js"></script>
<script src="static/js/views/WorkloadList.js"></script>
<script src="static/js/views/Catalogue.js"></script>
<script src="static/js/views/SideBar.js"></script>
<script src="static/js/frontpage.js"></script>
{% endblock %}
