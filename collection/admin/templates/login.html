{% extends "_base.html" %}

{% block head %}
{% endblock %}

{% block content %}
<h1>Login</h1>
<div class="block">
    <form method="POST" action="login">
        <div class="field">
            <p class="control">
                <input class="input" type="username" placeholder="username" name="username">
            </p>
        </div>
        <div class="field">
            <p class="control">
                <input class="input" type="password" placeholder="Password" name="password">
            </p>
        </div>
        <div class="field">
            <p class="control">
                <button type="submit" class="button is-success">
                    Login
                </button>
            </p>
        </div>
    </form>
</div>
{% endblock %}
