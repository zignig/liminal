{# this can be passed down from the app to make it dynamic #}
{% let sections = [("index","/"),("workload","Workloads")] %}
<div class="tabs is-boxed">
    <ul>
        {% for item in sections %}
        <li {% if item.0 == section %}class="is-active"{% endif %}>
            <a href="{{ item.0 }}"><span>{{ item.1 }}</span></a>
        </li>
        {% endfor %}
    </ul>
</div>
